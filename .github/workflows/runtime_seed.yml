name: runtime-seed

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/runtime_seed.yml'

permissions:
  contents: write

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Mirror source snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/src
          git clone --depth 1 https://github.com/huoguotiankong/hiker-cloud.git /tmp/src
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            /tmp/src/ ./

          while IFS= read -r -d '' f; do
            sed -i 's#huoguotiankong/hiker-cloud#huoguotiankong/asset-core-7f3#g' "$f"
          done < <(grep -IlRZ 'huoguotiankong/hiker-cloud' . --exclude-dir=.git --exclude-dir=.github || true)

          git config user.name 'runtime-sync'
          git config user.email 'runtime-sync@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'sync runtime snapshot'
          git push origin HEAD:main
